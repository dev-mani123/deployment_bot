name: Deployment PR Bot

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: "Deployment ticket"
        required: true
        type: string

      client:
        description: "Client name"
        required: true
        type: string

      target:
        description: "Exact deployment target"
        required: true
        type: choice
        options:
          - uat-stable
          - uat-preview
          - production-a
          - production-b

      release:
        description: "Release version"
        required: true
        type: string

jobs:
  validate-request:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Display deployment request
        run: |
          echo "================================"
          echo "Deployment PR Bot"
          echo "================================"
          echo "Ticket:  ${{ inputs.ticket }}"
          echo "Client:  ${{ inputs.client }}"
          echo "Target:  ${{ inputs.target }}"
          echo "Release: ${{ inputs.release }}"
          echo "================================"

      - name: Show repository files
        run: |
          echo "Repository files:"
          find . -maxdepth 5 -type f | sort

      - name: Resolve client configuration
        id: config
        shell: bash
        run: |
          CLIENT="${{ inputs.client }}"
          CONFIG_FILE="platform-client/clients/${CLIENT}/config.yml"

          echo "Looking for configuration:"
          echo "$CONFIG_FILE"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error::Client configuration not found: $CONFIG_FILE"
            exit 1
          fi

          echo "Configuration found:"
          echo "$CONFIG_FILE"

          echo "config_file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"

      - name: Read deployment target
        id: target
        shell: bash
        run: |
          CONFIG_FILE="${{ steps.config.outputs.config_file }}"
          TARGET="${{ inputs.target }}"

          echo "Reading configuration:"
          echo "$CONFIG_FILE"
          echo ""
          echo "Looking for exact target:"
          echo "$TARGET"

          node - "$CONFIG_FILE" "$TARGET" <<'NODE'
          const fs = require("fs");

          const file = process.argv[2];
          const target = process.argv[3];

          const content = fs.readFileSync(file, "utf8");

          const lines = content.split(/\r?\n/);

          let targetFound = false;
          let currentRelease = null;

          for (let i = 0; i < lines.length; i++) {
            const line = lines[i];

            if (line.trim() === `${target}:`) {
              targetFound = true;

              const targetIndent = line.length - line.trimStart().length;

              for (let j = i + 1; j < lines.length; j++) {
                const nextLine = lines[j];

                if (!nextLine.trim()) {
                  continue;
                }

                const nextIndent =
                  nextLine.length - nextLine.trimStart().length;

                if (
                  nextIndent <= targetIndent &&
                  /^[A-Za-z0-9_-]+:/.test(nextLine.trim())
                ) {
                  break;
                }

                const match = nextLine.match(
                  /^\s*continuous_deploy_tag:\s*([^\s#]+)/
                );

                if (match) {
                  currentRelease = match[1];
                  break;
                }
              }

              break;
            }
          }

          if (!targetFound) {
            console.error(
              `ERROR: Deployment target '${target}' was not found in ${file}`
            );
            process.exit(1);
          }

          if (!currentRelease) {
            console.error(
              `ERROR: continuous_deploy_tag was not found under '${target}'`
            );
            process.exit(1);
          }

          console.log("");
          console.log("================================");
          console.log("Configuration validated");
          console.log("================================");
          console.log(`File:            ${file}`);
          console.log(`Target:          ${target}`);
          console.log(`Current release: ${currentRelease}`);
          console.log("================================");

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `current_release=${currentRelease}\n`
          );
          NODE

      - name: Validate requested release
        shell: bash
        run: |
          CURRENT="${{ steps.target.outputs.current_release }}"
          REQUESTED="${{ inputs.release }}"

          echo "Current release:   $CURRENT"
          echo "Requested release: $REQUESTED"

          if [ "$CURRENT" = "$REQUESTED" ]; then
            echo "::error::Release $REQUESTED is already configured for ${{ inputs.client }} / ${{ inputs.target }}"
            exit 1
          fi

          echo "Release change is required."

      - name: Show deployment plan
        run: |
          echo ""
          echo "================================"
          echo "DEPLOYMENT PLAN"
          echo "================================"
          echo "Ticket:  ${{ inputs.ticket }}"
          echo "Client:  ${{ inputs.client }}"
          echo "Target:  ${{ inputs.target }}"
          echo "Release: ${{ inputs.release }}"
          echo ""
          echo "Configuration file:"
          echo "${{ steps.config.outputs.config_file }}"
          echo ""
          echo "Current release:"
          echo "${{ steps.target.outputs.current_release }}"
          echo ""
          echo "Requested release:"
          echo "${{ inputs.release }}"
          echo ""
          echo "Planned change:"
          echo "continuous_deploy_tag: ${{ steps.target.outputs.current_release }} -> ${{ inputs.release }}"
          echo ""
          echo "Planned branch:"
          echo "${{ inputs.ticket }}"
          echo ""
          echo "Planned commit:"
          echo "${{ inputs.ticket }}: Deploy ${{ inputs.release }} to ${{ inputs.target }} for ${{ inputs.client }}"
          echo ""
          echo "Planned PR:"
          echo "${{ inputs.ticket }} - Deploy ${{ inputs.release }} to ${{ inputs.target }} for ${{ inputs.client }}"
          echo "================================"
