name: Deployment PR Bot

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: "Deployment ticket"
        required: true
        type: string

      client:
        description: "Client name or ALL_CLIENTS"
        required: true
        type: string

      target:
        description: "Deployment target"
        required: true
        type: choice
        options:
          - qa_next
          - qa_stable
          - uat_stable
          - uat_preview
          - production_a
          - production_b

      release:
        description: "Release version"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-deployment-pr:
    runs-on: ubuntu-latest

    steps:

      # ==========================================================
      # 1. CHECKOUT
      # ==========================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # 2. NORMALIZE + VALIDATE INPUTS
      # ==========================================================

      - name: Normalize and validate inputs
        id: inputs
        shell: bash
        env:
          INPUT_TICKET: ${{ inputs.ticket }}
          INPUT_CLIENT: ${{ inputs.client }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          TICKET="$(printf '%s' "$INPUT_TICKET" | xargs)"
          CLIENT="$(printf '%s' "$INPUT_CLIENT" | xargs)"
          TARGET_INPUT="$(printf '%s' "$INPUT_TARGET" | xargs)"
          RELEASE="$(printf '%s' "$INPUT_RELEASE" | xargs)"

          if [ -z "$TICKET" ]; then
            echo "::error::Ticket cannot be empty."
            exit 1
          fi

          if [ -z "$CLIENT" ]; then
            echo "::error::Client cannot be empty."
            exit 1
          fi

          if [ -z "$TARGET_INPUT" ]; then
            echo "::error::Target cannot be empty."
            exit 1
          fi

          if [ -z "$RELEASE" ]; then
            echo "::error::Release cannot be empty."
            exit 1
          fi

          if [[ ! "$TICKET" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid ticket: $TICKET"
            exit 1
          fi

          if [[ ! "$CLIENT" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid client: $CLIENT"
            exit 1
          fi

          if [[ ! "$RELEASE" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid release: $RELEASE"
            exit 1
          fi

          CLIENT_NORMALIZED="$(
            printf '%s' "$CLIENT" |
            tr '[:upper:]' '[:lower:]'
          )"

          TARGET_NORMALIZED="$(
            printf '%s' "$TARGET_INPUT" |
            tr '[:upper:]' '[:lower:]'
          )"

          # ------------------------------------------------------
          # COMMAND TARGET -> YAML TARGET
          # ------------------------------------------------------

          case "$TARGET_NORMALIZED" in
            qa_next)
              ACTUAL_TARGET="qa-next"
              ;;

            qa_stable)
              ACTUAL_TARGET="qa-stable"
              ;;

            uat_stable)
              ACTUAL_TARGET="uat-stable"
              ;;

            uat_preview)
              ACTUAL_TARGET="uat-preview"
              ;;

            production_a)
              ACTUAL_TARGET="production-a"
              ;;

            production_b)
              ACTUAL_TARGET="production-b"
              ;;

            *)
              echo "::error::Unsupported target: $TARGET_INPUT"
              exit 1
              ;;
          esac

          # ------------------------------------------------------
          # Detect ALL_CLIENTS case-insensitively
          # ------------------------------------------------------

          if [ "$CLIENT_NORMALIZED" = "all_clients" ]; then
            ALL_CLIENTS="true"
          else
            ALL_CLIENTS="false"
          fi

          # ------------------------------------------------------
          # ALL_CLIENTS SAFETY RULE
          #
          # ALL_CLIENTS can ONLY be used for uat_preview.
          # ------------------------------------------------------

          if [ "$ALL_CLIENTS" = "true" ] &&
             [ "$TARGET_NORMALIZED" != "uat_preview" ]; then

            echo "::error::ALL_CLIENTS is supported only for uat_preview."
            echo "Requested target: $TARGET_INPUT"

            exit 1
          fi

          echo "ticket=$TICKET" >> "$GITHUB_OUTPUT"

          echo "client=$CLIENT" >> "$GITHUB_OUTPUT"
          echo "client_normalized=$CLIENT_NORMALIZED" >> "$GITHUB_OUTPUT"

          echo "target_input=$TARGET_INPUT" >> "$GITHUB_OUTPUT"
          echo "target_normalized=$TARGET_NORMALIZED" >> "$GITHUB_OUTPUT"
          echo "actual_target=$ACTUAL_TARGET" >> "$GITHUB_OUTPUT"

          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "all_clients=$ALL_CLIENTS" >> "$GITHUB_OUTPUT"

          echo ""
          echo "================================"
          echo "DEPLOYMENT REQUEST"
          echo "================================"
          echo "Ticket:      $TICKET"
          echo "Client:      $CLIENT"
          echo "Target:      $TARGET_NORMALIZED"
          echo "YAML target: $ACTUAL_TARGET"
          echo "Release:     $RELEASE"
          echo "All clients: $ALL_CLIENTS"
          echo "================================"

      # ==========================================================
      # 3. DUPLICATE BRANCH CHECK
      #
      # Case-insensitive.
      # ==========================================================

      - name: Check duplicate branch
        shell: bash
        env:
          REQUESTED_BRANCH: ${{ steps.inputs.outputs.ticket }}
        run: |
          MATCHING_BRANCH=""

          while IFS= read -r REMOTE_BRANCH; do

            BRANCH_NAME="${REMOTE_BRANCH#refs/heads/}"

            if [[ "${BRANCH_NAME,,}" == "${REQUESTED_BRANCH,,}" ]]; then
              MATCHING_BRANCH="$BRANCH_NAME"
              break
            fi

          done < <(
            git ls-remote \
              --heads \
              origin |
              awk '{print $2}'
          )

          if [ -n "$MATCHING_BRANCH" ]; then

            echo "::error::Branch already exists ignoring case."
            echo "Requested: $REQUESTED_BRANCH"
            echo "Existing:  $MATCHING_BRANCH"

            exit 1
          fi

          echo "No duplicate branch found."

      # ==========================================================
      # 4. DUPLICATE OPEN PR CHECK
      # ==========================================================

      - name: Check duplicate Pull Request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BRANCH: ${{ steps.inputs.outputs.ticket }}
        run: |
          EXISTING_PR=""

          while IFS='|' read -r PR_NUMBER PR_HEAD PR_URL; do

            if [[ "${PR_HEAD,,}" == "${REQUESTED_BRANCH,,}" ]]; then

              EXISTING_PR="$PR_NUMBER|$PR_HEAD|$PR_URL"

              break
            fi

          done < <(
            gh pr list \
              --state open \
              --limit 100 \
              --json number,headRefName,url \
              --jq '.[] | "\(.number)|\(.headRefName)|\(.url)"'
          )

          if [ -n "$EXISTING_PR" ]; then

            IFS='|' read -r \
              PR_NUMBER \
              PR_HEAD \
              PR_URL <<< "$EXISTING_PR"

            echo "::error::An open Pull Request already exists."
            echo "PR:     #$PR_NUMBER"
            echo "Branch: $PR_HEAD"
            echo "URL:    $PR_URL"

            exit 1
          fi

          echo "No duplicate Pull Request found."

      # ==========================================================
      # 5A. SINGLE CLIENT UPDATE
      #
      # Client directory is resolved case-insensitively.
      # ==========================================================

      - name: Update single client
        id: single
        if: steps.inputs.outputs.all_clients == 'false'
        shell: bash
        env:
          CLIENT_INPUT: ${{ steps.inputs.outputs.client }}
          TARGET: ${{ steps.inputs.outputs.actual_target }}
          RELEASE: ${{ steps.inputs.outputs.release }}
        run: |
          CLIENT_ROOT="platform-client/clients"

          if [ ! -d "$CLIENT_ROOT" ]; then
            echo "::error::Client root not found: $CLIENT_ROOT"
            exit 1
          fi

          MATCH_COUNT=0
          MATCHED_DIRECTORY=""

          while IFS= read -r CLIENT_DIRECTORY; do

            DIRECTORY_NAME="$(basename "$CLIENT_DIRECTORY")"

            if [[ "${DIRECTORY_NAME,,}" == "${CLIENT_INPUT,,}" ]]; then

              MATCH_COUNT=$((MATCH_COUNT + 1))
              MATCHED_DIRECTORY="$CLIENT_DIRECTORY"

            fi

          done < <(
            find "$CLIENT_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print
          )

          if [ "$MATCH_COUNT" -eq 0 ]; then

            echo "::error::Client '$CLIENT_INPUT' was not found."

            echo ""
            echo "Available clients:"

            find "$CLIENT_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' |
              sort -f

            exit 1
          fi

          if [ "$MATCH_COUNT" -gt 1 ]; then

            echo "::error::Multiple client directories match '$CLIENT_INPUT' ignoring case."
            echo "Refusing to guess."

            exit 1
          fi

          ACTUAL_CLIENT="$(basename "$MATCHED_DIRECTORY")"

          CONFIG_FILE="$MATCHED_DIRECTORY/config.yml"

          if [ ! -f "$CONFIG_FILE" ]; then

            echo "::error::config.yml not found for '$ACTUAL_CLIENT'."
            echo "Expected: $CONFIG_FILE"

            exit 1
          fi

          echo ""
          echo "Client resolved:"
          echo "$CLIENT_INPUT -> $ACTUAL_CLIENT"

          echo ""
          echo "Configuration:"
          echo "$CONFIG_FILE"

          UPDATE_SCRIPT="$RUNNER_TEMP/update-single-client.js"

          cat > "$UPDATE_SCRIPT" <<'NODE'
          const fs = require("fs");

          const file = process.argv[2];
          const target = process.argv[3];
          const release = process.argv[4];

          const original =
            fs.readFileSync(file, "utf8");

          const lineEnding =
            original.includes("\r\n")
              ? "\r\n"
              : "\n";

          const endedWithNewline =
            original.endsWith("\n");

          const lines =
            original.split(/\r?\n/);

          if (
            endedWithNewline &&
            lines.length > 0 &&
            lines[lines.length - 1] === ""
          ) {
            lines.pop();
          }

          const escaped =
            target.replace(
              /[.*+?^${}()|[\]\\]/g,
              "\\$&"
            );

          const targetPattern =
            new RegExp(
              `^${escaped}:\\s*(?:&[A-Za-z0-9._-]+)?\\s*$`,
              "i"
            );

          let targetFound = false;
          let tagFound = false;
          let oldRelease = null;

          for (let i = 0; i < lines.length; i++) {

            if (!targetPattern.test(lines[i].trim())) {
              continue;
            }

            targetFound = true;

            const targetIndent =
              lines[i].length -
              lines[i].trimStart().length;

            for (let j = i + 1; j < lines.length; j++) {

              const nextLine = lines[j];

              if (!nextLine.trim()) {
                continue;
              }

              const nextIndent =
                nextLine.length -
                nextLine.trimStart().length;

              if (
                nextIndent <= targetIndent &&
                /^[A-Za-z0-9._-]+:/.test(
                  nextLine.trim()
                )
              ) {
                break;
              }

              const match =
                nextLine.match(
                  /^(\s*continuous_deploy_tag:\s*)([^\s#]+)(.*)$/
                );

              if (!match) {
                continue;
              }

              oldRelease = match[2];

              if (
                oldRelease.toLowerCase() ===
                release.toLowerCase()
              ) {
                console.error(
                  `Release '${release}' is already configured for '${target}'.`
                );

                process.exit(2);
              }

              lines[j] =
                `${match[1]}${release}${match[3]}`;

              tagFound = true;

              break;
            }

            break;
          }

          if (!targetFound) {
            console.error(
              `Target '${target}' was not found.`
            );

            process.exit(1);
          }

          if (!tagFound) {
            console.error(
              `continuous_deploy_tag was not found under '${target}'.`
            );

            process.exit(1);
          }

          let updated =
            lines.join(lineEnding);

          if (endedWithNewline) {
            updated += lineEnding;
          }

          fs.writeFileSync(
            file,
            updated,
            "utf8"
          );

          console.log(oldRelease);
          NODE

          set +e

          OLD_RELEASE="$(
            node \
              "$UPDATE_SCRIPT" \
              "$CONFIG_FILE" \
              "$TARGET" \
              "$RELEASE"
          )"

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 0 ]; then

            echo "::error::Failed to update $ACTUAL_CLIENT."
            exit "$STATUS"
          fi

          echo "actual_client=$ACTUAL_CLIENT" >> "$GITHUB_OUTPUT"
          echo "config_file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"
          echo "old_release=$OLD_RELEASE" >> "$GITHUB_OUTPUT"

          echo ""
          echo "Updated:"
          echo "$ACTUAL_CLIENT"
          echo "$OLD_RELEASE -> $RELEASE"

      # ==========================================================
      # 5B. ALL CLIENTS UPDATE
      #
      # ONLY uat-preview.
      #
      # Dynamically discovers all clients.
      #
      # SKIPS:
      #
      # - missing config.yml
      # - missing uat-preview
      # - missing continuous_deploy_tag
      # - already on requested release
      # ==========================================================

      - name: Update all clients
        id: all
        if: steps.inputs.outputs.all_clients == 'true'
        shell: bash
        env:
          RELEASE: ${{ steps.inputs.outputs.release }}
        run: |
          CLIENT_ROOT="platform-client/clients"
          TARGET="uat-preview"

          UPDATED_FILE="$RUNNER_TEMP/updated-clients.txt"
          SKIPPED_FILE="$RUNNER_TEMP/skipped-clients.txt"
          UPDATE_SCRIPT="$RUNNER_TEMP/update-client.js"

          : > "$UPDATED_FILE"
          : > "$SKIPPED_FILE"

          UPDATED_COUNT=0
          SKIPPED_COUNT=0

          if [ ! -d "$CLIENT_ROOT" ]; then

            echo "::error::Client root not found: $CLIENT_ROOT"

            exit 1
          fi

          echo ""
          echo "================================"
          echo "ALL CLIENTS MODE"
          echo "================================"
          echo "Target:  $TARGET"
          echo "Release: $RELEASE"
          echo "================================"

          # ------------------------------------------------------
          # JavaScript helper.
          #
          # Created once and executed for every client.
          #
          # Exit codes:
          #
          # 0  = updated
          # 10 = target missing
          # 11 = tag missing
          # 12 = already configured
          # ------------------------------------------------------

          cat > "$UPDATE_SCRIPT" <<'NODE'
          const fs = require("fs");

          const file = process.argv[2];
          const target = process.argv[3];
          const release = process.argv[4];

          const original =
            fs.readFileSync(file, "utf8");

          const lineEnding =
            original.includes("\r\n")
              ? "\r\n"
              : "\n";

          const endedWithNewline =
            original.endsWith("\n");

          const lines =
            original.split(/\r?\n/);

          if (
            endedWithNewline &&
            lines.length > 0 &&
            lines[lines.length - 1] === ""
          ) {
            lines.pop();
          }

          const escapedTarget =
            target.replace(
              /[.*+?^${}()|[\]\\]/g,
              "\\$&"
            );

          const targetPattern =
            new RegExp(
              `^${escapedTarget}:\\s*(?:&[A-Za-z0-9._-]+)?\\s*$`,
              "i"
            );

          let targetFound = false;
          let tagFound = false;
          let oldRelease = null;

          for (let i = 0; i < lines.length; i++) {

            if (
              !targetPattern.test(
                lines[i].trim()
              )
            ) {
              continue;
            }

            targetFound = true;

            const targetIndent =
              lines[i].length -
              lines[i].trimStart().length;

            for (let j = i + 1; j < lines.length; j++) {

              const nextLine = lines[j];

              if (!nextLine.trim()) {
                continue;
              }

              const nextIndent =
                nextLine.length -
                nextLine.trimStart().length;

              if (
                nextIndent <= targetIndent &&
                /^[A-Za-z0-9._-]+:/.test(
                  nextLine.trim()
                )
              ) {
                break;
              }

              const match =
                nextLine.match(
                  /^(\s*continuous_deploy_tag:\s*)([^\s#]+)(.*)$/
                );

              if (!match) {
                continue;
              }

              tagFound = true;
              oldRelease = match[2];

              if (
                oldRelease.toLowerCase() ===
                release.toLowerCase()
              ) {
                console.log(
                  `ALREADY|${oldRelease}`
                );

                process.exit(12);
              }

              lines[j] =
                `${match[1]}${release}${match[3]}`;

              break;
            }

            break;
          }

          if (!targetFound) {

            console.log("TARGET_MISSING");

            process.exit(10);
          }

          if (!tagFound) {

            console.log("TAG_MISSING");

            process.exit(11);
          }

          let updated =
            lines.join(lineEnding);

          if (endedWithNewline) {
            updated += lineEnding;
          }

          fs.writeFileSync(
            file,
            updated,
            "utf8"
          );

          console.log(
            `UPDATED|${oldRelease}`
          );

          process.exit(0);
          NODE

          # ------------------------------------------------------
          # Process every client directory.
          # ------------------------------------------------------

          while IFS= read -r CLIENT_DIRECTORY; do

            CLIENT_NAME="$(basename "$CLIENT_DIRECTORY")"

            CONFIG_FILE="$CLIENT_DIRECTORY/config.yml"

            echo ""
            echo "--------------------------------"
            echo "Processing: $CLIENT_NAME"
            echo "--------------------------------"

            # ----------------------------------------------------
            # Missing config.yml
            # ----------------------------------------------------

            if [ ! -f "$CONFIG_FILE" ]; then

              echo "SKIPPED: config.yml not found"

              printf '%s|%s\n' \
                "$CLIENT_NAME" \
                "config.yml not found" \
                >> "$SKIPPED_FILE"

              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))

              continue
            fi

            # ----------------------------------------------------
            # Run helper.
            # ----------------------------------------------------

            set +e

            RESULT="$(
              node \
                "$UPDATE_SCRIPT" \
                "$CONFIG_FILE" \
                "$TARGET" \
                "$RELEASE"
            )"

            STATUS=$?

            set -e

            # ----------------------------------------------------
            # UPDATED
            # ----------------------------------------------------

            if [ "$STATUS" -eq 0 ]; then

              OLD_RELEASE="${RESULT#UPDATED|}"

              echo "UPDATED"
              echo "Previous: $OLD_RELEASE"
              echo "New:      $RELEASE"

              printf '%s|%s|%s\n' \
                "$CLIENT_NAME" \
                "$OLD_RELEASE" \
                "$RELEASE" \
                >> "$UPDATED_FILE"

              UPDATED_COUNT=$((UPDATED_COUNT + 1))

            # ----------------------------------------------------
            # TARGET MISSING
            # ----------------------------------------------------

            elif [ "$STATUS" -eq 10 ]; then

              echo "SKIPPED: uat-preview not found"

              printf '%s|%s\n' \
                "$CLIENT_NAME" \
                "uat-preview not found" \
                >> "$SKIPPED_FILE"

              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))

            # ----------------------------------------------------
            # TAG MISSING
            # ----------------------------------------------------

            elif [ "$STATUS" -eq 11 ]; then

              echo "SKIPPED: continuous_deploy_tag not present"

              printf '%s|%s\n' \
                "$CLIENT_NAME" \
                "continuous_deploy_tag not present" \
                >> "$SKIPPED_FILE"

              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))

            # ----------------------------------------------------
            # ALREADY CONFIGURED
            # ----------------------------------------------------

            elif [ "$STATUS" -eq 12 ]; then

              OLD_RELEASE="${RESULT#ALREADY|}"

              echo "SKIPPED: already configured with $OLD_RELEASE"

              printf '%s|%s\n' \
                "$CLIENT_NAME" \
                "already configured with $OLD_RELEASE" \
                >> "$SKIPPED_FILE"

              SKIPPED_COUNT=$((SKIPPED_COUNT + 1))

            # ----------------------------------------------------
            # UNEXPECTED ERROR
            # ----------------------------------------------------

            else

              echo "::error::Unexpected error while processing $CLIENT_NAME"

              echo "Output:"
              echo "$RESULT"

              echo "Exit code:"
              echo "$STATUS"

              exit 1
            fi

          done < <(
            find "$CLIENT_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print |
              sort -f
          )

          # ------------------------------------------------------
          # SUMMARY
          # ------------------------------------------------------

          echo ""
          echo "================================"
          echo "ALL CLIENTS RESULT"
          echo "================================"

          echo "Updated clients: $UPDATED_COUNT"
          echo "Skipped clients: $SKIPPED_COUNT"

          echo ""
          echo "UPDATED CLIENTS"
          echo "--------------------------------"

          if [ -s "$UPDATED_FILE" ]; then

            while IFS='|' read -r CLIENT OLD NEW; do

              echo "$CLIENT: $OLD -> $NEW"

            done < "$UPDATED_FILE"

          else

            echo "None"

          fi

          echo ""
          echo "SKIPPED CLIENTS"
          echo "--------------------------------"

          if [ -s "$SKIPPED_FILE" ]; then

            while IFS='|' read -r CLIENT REASON; do

              echo "$CLIENT: $REASON"

            done < "$SKIPPED_FILE"

          else

            echo "None"

          fi

          echo "================================"

          # ------------------------------------------------------
          # Require at least one actual update.
          # ------------------------------------------------------

          if [ "$UPDATED_COUNT" -eq 0 ]; then

            echo "::error::No clients required an update."

            exit 1
          fi

          echo "updated_count=$UPDATED_COUNT" >> "$GITHUB_OUTPUT"
          echo "skipped_count=$SKIPPED_COUNT" >> "$GITHUB_OUTPUT"

          echo "updated_file=$UPDATED_FILE" >> "$GITHUB_OUTPUT"
          echo "skipped_file=$SKIPPED_FILE" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 6A. VERIFY SINGLE CLIENT CHANGE
      # ==========================================================

      - name: Verify single client change
        if: steps.inputs.outputs.all_clients == 'false'
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.single.outputs.config_file }}
        run: |
          echo ""
          echo "================================"
          echo "SINGLE CLIENT GIT DIFF"
          echo "================================"

          git diff -- "$CONFIG_FILE"

          if git diff --quiet; then

            echo "::error::No change produced."

            exit 1
          fi

          CHANGED_FILES="$(
            git diff --name-only
          )"

          if [ "$CHANGED_FILES" != "$CONFIG_FILE" ]; then

            echo "::error::Unexpected files changed."

            exit 1
          fi

          ADDED="$(
            git diff \
              --numstat \
              -- "$CONFIG_FILE" |
              awk '{print $1}'
          )"

          REMOVED="$(
            git diff \
              --numstat \
              -- "$CONFIG_FILE" |
              awk '{print $2}'
          )"

          if [ "$ADDED" -ne 1 ] ||
             [ "$REMOVED" -ne 1 ]; then

            echo "::error::Expected exactly one tag replacement."

            exit 1
          fi

          ADDED_TAG_LINES="$(
            git diff \
              --unified=0 \
              -- "$CONFIG_FILE" |
              grep '^+' |
              grep -v '^+++' |
              grep -c 'continuous_deploy_tag:' ||
              true
          )"

          REMOVED_TAG_LINES="$(
            git diff \
              --unified=0 \
              -- "$CONFIG_FILE" |
              grep '^-' |
              grep -v '^---' |
              grep -c 'continuous_deploy_tag:' ||
              true
          )"

          if [ "$ADDED_TAG_LINES" -ne 1 ] ||
             [ "$REMOVED_TAG_LINES" -ne 1 ]; then

            echo "::error::A non-continuous_deploy_tag change was detected."

            exit 1
          fi

          echo ""
          echo "Single-client validation successful."

      # ==========================================================
      # 6B. VERIFY ALL CLIENT CHANGES
      #
      # Every changed file must:
      #
      # platform-client/clients/<client>/config.yml
      #
      # Each changed config must have exactly:
      #
      # 1 removed continuous_deploy_tag
      # 1 added continuous_deploy_tag
      # ==========================================================

      - name: Verify all client changes
        if: steps.inputs.outputs.all_clients == 'true'
        shell: bash
        run: |
          echo ""
          echo "================================"
          echo "ALL CLIENTS GIT DIFF"
          echo "================================"

          git diff

          CHANGED_FILES="$(
            git diff --name-only
          )"

          if [ -z "$CHANGED_FILES" ]; then

            echo "::error::No files changed."

            exit 1
          fi

          while IFS= read -r FILE; do

            echo ""
            echo "Validating:"
            echo "$FILE"

            if [[ ! "$FILE" =~ ^platform-client/clients/[^/]+/config\.yml$ ]]; then

              echo "::error::Unexpected file modified: $FILE"

              exit 1
            fi

            ADDED="$(
              git diff \
                --numstat \
                -- "$FILE" |
                awk '{print $1}'
            )"

            REMOVED="$(
              git diff \
                --numstat \
                -- "$FILE" |
                awk '{print $2}'
            )"

            if [ "$ADDED" -ne 1 ] ||
               [ "$REMOVED" -ne 1 ]; then

              echo "::error::Unexpected number of changed lines in $FILE"

              echo "Added:   $ADDED"
              echo "Removed: $REMOVED"

              exit 1
            fi

            ADDED_TAG_LINES="$(
              git diff \
                --unified=0 \
                -- "$FILE" |
                grep '^+' |
                grep -v '^+++' |
                grep -c 'continuous_deploy_tag:' ||
                true
            )"

            REMOVED_TAG_LINES="$(
              git diff \
                --unified=0 \
                -- "$FILE" |
                grep '^-' |
                grep -v '^---' |
                grep -c 'continuous_deploy_tag:' ||
                true
            )"

            if [ "$ADDED_TAG_LINES" -ne 1 ] ||
               [ "$REMOVED_TAG_LINES" -ne 1 ]; then

              echo "::error::A non-continuous_deploy_tag change was detected in $FILE"

              exit 1
            fi

          done <<< "$CHANGED_FILES"

          echo ""
          echo "All-client validation successful."

      # ==========================================================
      # 7. CREATE DEPLOYMENT BRANCH
      # ==========================================================

      - name: Create deployment branch
        shell: bash
        env:
          BRANCH: ${{ steps.inputs.outputs.ticket }}
        run: |
          echo "Creating branch:"
          echo "$BRANCH"

          git checkout -b "$BRANCH"

      # ==========================================================
      # 8. COMMIT
      # ==========================================================

      - name: Commit changes
        shell: bash
        env:
          TICKET: ${{ steps.inputs.outputs.ticket }}
          REQUESTED_CLIENT: ${{ steps.inputs.outputs.client }}
          ACTUAL_CLIENT: ${{ steps.single.outputs.actual_client }}
          ALL_CLIENTS: ${{ steps.inputs.outputs.all_clients }}
          TARGET: ${{ steps.inputs.outputs.actual_target }}
          RELEASE: ${{ steps.inputs.outputs.release }}
        run: |
          git config \
            user.name \
            "deployment-pr-bot"

          git config \
            user.email \
            "deployment-pr-bot@users.noreply.github.com"

          if [ "$ALL_CLIENTS" = "true" ]; then
            COMMIT_CLIENT="ALL_CLIENTS"
          else
            COMMIT_CLIENT="$ACTUAL_CLIENT"
          fi

          git add platform-client/clients

          git commit \
            -m "$TICKET: Deploy $RELEASE to $TARGET for $COMMIT_CLIENT"

      # ==========================================================
      # 9. PUSH BRANCH
      # ==========================================================

      - name: Push deployment branch
        shell: bash
        env:
          BRANCH: ${{ steps.inputs.outputs.ticket }}
        run: |
          echo "Pushing:"
          echo "$BRANCH"

          git push \
            origin \
            "$BRANCH"

      # ==========================================================
      # 10A. SINGLE CLIENT PR BODY
      # ==========================================================

      - name: Build single client PR body
        id: single_body
        if: steps.inputs.outputs.all_clients == 'false'
        shell: bash
        env:
          TICKET: ${{ steps.inputs.outputs.ticket }}
          CLIENT: ${{ steps.single.outputs.actual_client }}
          TARGET: ${{ steps.inputs.outputs.actual_target }}
          RELEASE: ${{ steps.inputs.outputs.release }}
          OLD_RELEASE: ${{ steps.single.outputs.old_release }}
          CONFIG_FILE: ${{ steps.single.outputs.config_file }}
        run: |
          BODY_FILE="$RUNNER_TEMP/pr-body.md"

          cat > "$BODY_FILE" <<EOF
          ## Deployment Request

          **Deployment Ticket:** $TICKET

          **Client:** $CLIENT

          **Deployment Target:** $TARGET

          **Release:** $RELEASE

          ## Configuration

          \`$CONFIG_FILE\`

          ## Configuration Change

          **Field:** \`continuous_deploy_tag\`

          **Previous:** \`$OLD_RELEASE\`

          **New:** \`$RELEASE\`

          ## Branch

          \`$TICKET\`

          ---

          Created automatically by Deployment PR Bot.
          EOF

          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 10B. ALL CLIENTS PR BODY
      # ==========================================================

      - name: Build all clients PR body
        id: all_body
        if: steps.inputs.outputs.all_clients == 'true'
        shell: bash
        env:
          TICKET: ${{ steps.inputs.outputs.ticket }}
          RELEASE: ${{ steps.inputs.outputs.release }}

          UPDATED_COUNT: ${{ steps.all.outputs.updated_count }}
          SKIPPED_COUNT: ${{ steps.all.outputs.skipped_count }}

          UPDATED_FILE: ${{ steps.all.outputs.updated_file }}
          SKIPPED_FILE: ${{ steps.all.outputs.skipped_file }}
        run: |
          BODY_FILE="$RUNNER_TEMP/pr-body.md"

          {
            echo "## Deployment Request"
            echo ""
            echo "**Deployment Ticket:** $TICKET"
            echo ""
            echo "**Client:** ALL_CLIENTS"
            echo ""
            echo "**Deployment Target:** uat-preview"
            echo ""
            echo "**Release:** $RELEASE"

            echo ""
            echo "## Summary"
            echo ""
            echo "**Updated clients:** $UPDATED_COUNT"
            echo ""
            echo "**Skipped clients:** $SKIPPED_COUNT"

            echo ""
            echo "## Updated Clients"
            echo ""

            while IFS='|' read -r CLIENT OLD NEW; do

              [ -z "$CLIENT" ] && continue

              echo "- **$CLIENT:** \`$OLD\` -> \`$NEW\`"

            done < "$UPDATED_FILE"

            echo ""
            echo "## Skipped Clients"
            echo ""

            if [ -s "$SKIPPED_FILE" ]; then

              while IFS='|' read -r CLIENT REASON; do

                [ -z "$CLIENT" ] && continue

                echo "- **$CLIENT:** $REASON"

              done < "$SKIPPED_FILE"

            else

              echo "None"

            fi

            echo ""
            echo "## Branch"
            echo ""
            echo "\`$TICKET\`"

            echo ""
            echo "---"
            echo ""
            echo "Created automatically by Deployment PR Bot."

          } > "$BODY_FILE"

          echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 11. CREATE PULL REQUEST
      # ==========================================================

      - name: Create Pull Request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

          TICKET: ${{ steps.inputs.outputs.ticket }}

          REQUESTED_CLIENT: ${{ steps.inputs.outputs.client }}

          ACTUAL_CLIENT: ${{ steps.single.outputs.actual_client }}

          TARGET: ${{ steps.inputs.outputs.actual_target }}

          RELEASE: ${{ steps.inputs.outputs.release }}

          ALL_CLIENTS: ${{ steps.inputs.outputs.all_clients }}

          SINGLE_BODY: ${{ steps.single_body.outputs.body_file }}

          ALL_BODY: ${{ steps.all_body.outputs.body_file }}
        run: |
          if [ "$ALL_CLIENTS" = "true" ]; then

            PR_CLIENT="ALL_CLIENTS"
            BODY_FILE="$ALL_BODY"

          else

            PR_CLIENT="$ACTUAL_CLIENT"
            BODY_FILE="$SINGLE_BODY"

          fi

          PR_TITLE="$TICKET - CD tag update $RELEASE to $TARGET for $PR_CLIENT"

          PR_URL="$(
            gh pr create \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$TICKET" \
              --title "$PR_TITLE" \
              --body-file "$BODY_FILE"
          )"

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 12. FINAL SUMMARY
      # ==========================================================

      - name: Deployment PR summary
        shell: bash
        run: |
          echo ""
          echo "================================"
          echo "DEPLOYMENT PR CREATED"
          echo "================================"

          echo ""
          echo "Ticket:"
          echo "${{ steps.inputs.outputs.ticket }}"

          echo ""
          echo "Requested client:"
          echo "${{ steps.inputs.outputs.client }}"

          echo ""
          echo "Target:"
          echo "${{ steps.inputs.outputs.actual_target }}"

          echo ""
          echo "Release:"
          echo "${{ steps.inputs.outputs.release }}"

          if [ "${{ steps.inputs.outputs.all_clients }}" = "true" ]; then

            echo ""
            echo "Updated clients:"
            echo "${{ steps.all.outputs.updated_count }}"

            echo ""
            echo "Skipped clients:"
            echo "${{ steps.all.outputs.skipped_count }}"

          else

            echo ""
            echo "Resolved client:"
            echo "${{ steps.single.outputs.actual_client }}"

            echo ""
            echo "Previous release:"
            echo "${{ steps.single.outputs.old_release }}"

          fi

          echo ""
          echo "Branch:"
          echo "${{ steps.inputs.outputs.ticket }}"

          echo ""
          echo "Pull Request:"
          echo "${{ steps.pr.outputs.pr_url }}"

          echo ""
          echo "================================"
