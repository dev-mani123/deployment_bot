name: Deployment PR Bot

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: "Deployment ticket"
        required: true
        type: string

      client:
        description: "Client name (case-insensitive)"
        required: true
        type: string

      target:
        description: "Deployment target (case-insensitive)"
        required: true
        type: string

      release:
        description: "Release version"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-deployment-pr:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. NORMALIZE AND VALIDATE INPUTS
      # ============================================================

      - name: Normalize and validate inputs
        id: inputs
        shell: bash
        env:
          INPUT_TICKET: ${{ inputs.ticket }}
          INPUT_CLIENT: ${{ inputs.client }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_RELEASE: ${{ inputs.release }}
        run: |
          TICKET="$(printf '%s' "$INPUT_TICKET" | xargs)"
          CLIENT="$(printf '%s' "$INPUT_CLIENT" | xargs)"
          TARGET="$(printf '%s' "$INPUT_TARGET" | xargs)"
          RELEASE="$(printf '%s' "$INPUT_RELEASE" | xargs)"

          if [ -z "$TICKET" ]; then
            echo "::error::Ticket cannot be empty."
            exit 1
          fi

          if [ -z "$CLIENT" ]; then
            echo "::error::Client cannot be empty."
            exit 1
          fi

          if [ -z "$TARGET" ]; then
            echo "::error::Deployment target cannot be empty."
            exit 1
          fi

          if [ -z "$RELEASE" ]; then
            echo "::error::Release cannot be empty."
            exit 1
          fi

          if [[ ! "$TICKET" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid ticket/branch name: $TICKET"
            exit 1
          fi

          if [[ ! "$CLIENT" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid client name: $CLIENT"
            exit 1
          fi

          if [[ ! "$TARGET" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid deployment target: $TARGET"
            exit 1
          fi

          if [[ ! "$RELEASE" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid release: $RELEASE"
            exit 1
          fi

          # Lowercase values used only for comparisons.
          TICKET_LOWER="$(printf '%s' "$TICKET" | tr '[:upper:]' '[:lower:]')"
          CLIENT_LOWER="$(printf '%s' "$CLIENT" | tr '[:upper:]' '[:lower:]')"
          TARGET_LOWER="$(printf '%s' "$TARGET" | tr '[:upper:]' '[:lower:]')"

          echo "ticket=$TICKET" >> "$GITHUB_OUTPUT"
          echo "ticket_lower=$TICKET_LOWER" >> "$GITHUB_OUTPUT"

          echo "client_input=$CLIENT" >> "$GITHUB_OUTPUT"
          echo "client_lower=$CLIENT_LOWER" >> "$GITHUB_OUTPUT"

          echo "target_input=$TARGET" >> "$GITHUB_OUTPUT"
          echo "target_lower=$TARGET_LOWER" >> "$GITHUB_OUTPUT"

          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"

          echo "Input validation successful."

      # ============================================================
      # 3. DISPLAY REQUEST
      # ============================================================

      - name: Display deployment request
        shell: bash
        run: |
          echo "================================"
          echo "Deployment PR Bot"
          echo "================================"
          echo "Ticket:  ${{ steps.inputs.outputs.ticket }}"
          echo "Client:  ${{ steps.inputs.outputs.client_input }}"
          echo "Target:  ${{ steps.inputs.outputs.target_input }}"
          echo "Release: ${{ steps.inputs.outputs.release }}"
          echo "================================"

      # ============================================================
      # 4. RESOLVE CLIENT CASE-INSENSITIVELY
      #
      # Examples:
      #
      # centene
      # CENTENE
      # Centene
      #
      # all resolve to the real directory:
      #
      # platform-client/clients/Centene
      # ============================================================

      - name: Resolve client configuration
        id: config
        shell: bash
        env:
          CLIENT_INPUT: ${{ steps.inputs.outputs.client_input }}
        run: |
          CLIENT_ROOT="platform-client/clients"

          if [ ! -d "$CLIENT_ROOT" ]; then
            echo "::error::Client directory does not exist: $CLIENT_ROOT"
            exit 1
          fi

          MATCH_COUNT=0
          MATCHED_DIRECTORY=""

          while IFS= read -r CLIENT_DIRECTORY; do
            DIRECTORY_NAME="$(basename "$CLIENT_DIRECTORY")"

            if [[ "${DIRECTORY_NAME,,}" == "${CLIENT_INPUT,,}" ]]; then
              MATCH_COUNT=$((MATCH_COUNT + 1))
              MATCHED_DIRECTORY="$CLIENT_DIRECTORY"
            fi
          done < <(
            find "$CLIENT_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -print
          )

          if [ "$MATCH_COUNT" -eq 0 ]; then
            echo "::error::Client '$CLIENT_INPUT' was not found."

            echo ""
            echo "Available clients:"

            find "$CLIENT_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -type d \
              -printf '%f\n' |
              sort -f

            exit 1
          fi

          if [ "$MATCH_COUNT" -gt 1 ]; then
            echo "::error::Multiple client directories match '$CLIENT_INPUT' case-insensitively."
            echo "Refusing to guess."
            exit 1
          fi

          ACTUAL_CLIENT="$(basename "$MATCHED_DIRECTORY")"
          CONFIG_FILE="${MATCHED_DIRECTORY}/config.yml"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error::config.yml not found for client '$ACTUAL_CLIENT'."
            echo "Expected: $CONFIG_FILE"
            exit 1
          fi

          echo ""
          echo "Client resolved:"
          echo "$CLIENT_INPUT -> $ACTUAL_CLIENT"

          echo ""
          echo "Configuration:"
          echo "$CONFIG_FILE"

          echo "actual_client=$ACTUAL_CLIENT" >> "$GITHUB_OUTPUT"
          echo "config_file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. RESOLVE TARGET CASE-INSENSITIVELY
      #
      # Supports:
      #
      # uat-preview:
      # uat-preview: &uat
      # production-a: &production
      #
      # User may enter:
      #
      # UAT-PREVIEW
      # Uat-Preview
      # uat-preview
      #
      # ============================================================

      - name: Resolve deployment target
        id: target
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.config.outputs.config_file }}
          TARGET_INPUT: ${{ steps.inputs.outputs.target_input }}
        run: |
          node - "$CONFIG_FILE" "$TARGET_INPUT" <<'NODE'
          const fs = require("fs");

          const file = process.argv[2];
          const requestedTarget = process.argv[3];

          const content = fs.readFileSync(file, "utf8");
          const lines = content.split(/\r?\n/);

          const requestedLower =
            requestedTarget.toLowerCase();

          const matches = [];

          /*
           * Match YAML section declarations such as:
           *
           * uat-preview:
           * uat-preview: &uat
           * production-a: &production
           *
           * Capture the actual key from the file.
           */
          const sectionPattern =
            /^([A-Za-z0-9._-]+):\s*(?:&[A-Za-z0-9._-]+)?\s*$/;

          for (let i = 0; i < lines.length; i++) {
            const trimmed = lines[i].trim();

            const match =
              trimmed.match(sectionPattern);

            if (!match) {
              continue;
            }

            const actualTarget = match[1];

            if (
              actualTarget.toLowerCase() ===
              requestedLower
            ) {
              matches.push({
                index: i,
                actualTarget,
                line: lines[i]
              });
            }
          }

          if (matches.length === 0) {
            console.error(
              `ERROR: Deployment target '${requestedTarget}' was not found in ${file}.`
            );

            console.error("");
            console.error("Available sections:");

            for (const line of lines) {
              const match =
                line.trim().match(sectionPattern);

              if (match) {
                console.error(` - ${match[1]}`);
              }
            }

            process.exit(1);
          }

          if (matches.length > 1) {
            console.error(
              `ERROR: Multiple YAML sections match '${requestedTarget}' case-insensitively.`
            );

            console.error(
              "Refusing to guess which section should be changed."
            );

            process.exit(1);
          }

          const targetMatch = matches[0];

          const actualTarget =
            targetMatch.actualTarget;

          const targetLine =
            targetMatch.line;

          const targetIndex =
            targetMatch.index;

          const targetIndent =
            targetLine.length -
            targetLine.trimStart().length;

          let currentRelease = null;

          for (
            let i = targetIndex + 1;
            i < lines.length;
            i++
          ) {
            const line = lines[i];

            if (!line.trim()) {
              continue;
            }

            const indentation =
              line.length -
              line.trimStart().length;

            if (
              indentation <= targetIndent &&
              /^[A-Za-z0-9._-]+:/.test(
                line.trim()
              )
            ) {
              break;
            }

            const releaseMatch =
              line.match(
                /^\s*continuous_deploy_tag:\s*([^\s#]+)/
              );

            if (releaseMatch) {
              currentRelease =
                releaseMatch[1];

              break;
            }
          }

          if (!currentRelease) {
            console.error(
              `ERROR: continuous_deploy_tag was not found under '${actualTarget}'.`
            );

            process.exit(1);
          }

          console.log("");
          console.log("Target resolved:");
          console.log(
            `${requestedTarget} -> ${actualTarget}`
          );

          console.log("");
          console.log(
            `Current release: ${currentRelease}`
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `actual_target=${actualTarget}\n`
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `current_release=${currentRelease}\n`
          );
          NODE

      # ============================================================
      # 6. VALIDATE RELEASE
      #
      # Release comparison is also case-insensitive,
      # but the requested release text is preserved.
      # ============================================================

      - name: Validate requested release
        shell: bash
        env:
          CURRENT_RELEASE: ${{ steps.target.outputs.current_release }}
          REQUESTED_RELEASE: ${{ steps.inputs.outputs.release }}
        run: |
          if [[ "${CURRENT_RELEASE,,}" == "${REQUESTED_RELEASE,,}" ]]; then
            echo "::error::Release '$REQUESTED_RELEASE' is already configured."
            exit 1
          fi

          echo "Current release:   $CURRENT_RELEASE"
          echo "Requested release: $REQUESTED_RELEASE"
          echo "Release change required."

      # ============================================================
      # 7. CHECK BRANCH CASE-INSENSITIVELY
      #
      # TEST-106
      # test-106
      # Test-106
      #
      # are considered duplicates.
      # ============================================================

      - name: Check duplicate branch
        shell: bash
        env:
          REQUESTED_BRANCH: ${{ steps.inputs.outputs.ticket }}
        run: |
          echo "Checking existing branches case-insensitively..."

          MATCHING_BRANCH=""

          while IFS= read -r REMOTE_BRANCH; do
            BRANCH_NAME="${REMOTE_BRANCH#refs/heads/}"

            if [[ "${BRANCH_NAME,,}" == "${REQUESTED_BRANCH,,}" ]]; then
              MATCHING_BRANCH="$BRANCH_NAME"
              break
            fi
          done < <(
            git ls-remote \
              --heads \
              origin |
              awk '{print $2}'
          )

          if [ -n "$MATCHING_BRANCH" ]; then
            echo "::error::A branch already exists with the same name ignoring case."
            echo "Requested: $REQUESTED_BRANCH"
            echo "Existing:  $MATCHING_BRANCH"
            exit 1
          fi

          echo "No duplicate branch found."

      # ============================================================
      # 8. CHECK OPEN PR FOR TICKET/BRANCH
      # ============================================================

      - name: Check duplicate Pull Request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_BRANCH: ${{ steps.inputs.outputs.ticket }}
        run: |
          EXISTING_PR=""

          while IFS='|' read -r PR_NUMBER PR_HEAD PR_URL; do
            if [[ "${PR_HEAD,,}" == "${REQUESTED_BRANCH,,}" ]]; then
              EXISTING_PR="$PR_NUMBER|$PR_HEAD|$PR_URL"
              break
            fi
          done < <(
            gh pr list \
              --state open \
              --limit 100 \
              --json number,headRefName,url \
              --jq '.[] | "\(.number)|\(.headRefName)|\(.url)"'
          )

          if [ -n "$EXISTING_PR" ]; then
            IFS='|' read -r \
              PR_NUMBER \
              PR_HEAD \
              PR_URL <<< "$EXISTING_PR"

            echo "::error::An open Pull Request already exists for this branch ignoring case."
            echo "PR:     #$PR_NUMBER"
            echo "Branch: $PR_HEAD"
            echo "URL:    $PR_URL"

            exit 1
          fi

          echo "No duplicate Pull Request found."

      # ============================================================
      # 9. UPDATE ONLY continuous_deploy_tag
      #
      # Preserve:
      #
      # - actual target casing
      # - CRLF/LF
      # - YAML anchors
      # - spacing
      # - unrelated configuration
      # ============================================================

      - name: Update continuous deploy tag
        id: update
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.config.outputs.config_file }}
          ACTUAL_TARGET: ${{ steps.target.outputs.actual_target }}
          REQUESTED_RELEASE: ${{ steps.inputs.outputs.release }}
        run: |
          node - \
            "$CONFIG_FILE" \
            "$ACTUAL_TARGET" \
            "$REQUESTED_RELEASE" <<'NODE'

          const fs = require("fs");

          const file = process.argv[2];
          const actualTarget = process.argv[3];
          const requestedRelease = process.argv[4];

          const originalContent =
            fs.readFileSync(file, "utf8");

          const lineEnding =
            originalContent.includes("\r\n")
              ? "\r\n"
              : "\n";

          const endedWithNewline =
            originalContent.endsWith("\n");

          const lines =
            originalContent.split(/\r?\n/);

          if (
            endedWithNewline &&
            lines.length > 0 &&
            lines[lines.length - 1] === ""
          ) {
            lines.pop();
          }

          const escapedTarget =
            actualTarget.replace(
              /[.*+?^${}()|[\]\\]/g,
              "\\$&"
            );

          const targetPattern =
            new RegExp(
              `^${escapedTarget}:\\s*(?:&[A-Za-z0-9._-]+)?\\s*$`
            );

          let targetFound = false;
          let tagFound = false;
          let oldRelease = null;

          for (
            let i = 0;
            i < lines.length;
            i++
          ) {
            const line = lines[i];

            if (
              !targetPattern.test(
                line.trim()
              )
            ) {
              continue;
            }

            targetFound = true;

            const targetIndent =
              line.length -
              line.trimStart().length;

            for (
              let j = i + 1;
              j < lines.length;
              j++
            ) {
              const nextLine =
                lines[j];

              if (!nextLine.trim()) {
                continue;
              }

              const nextIndent =
                nextLine.length -
                nextLine.trimStart().length;

              if (
                nextIndent <= targetIndent &&
                /^[A-Za-z0-9._-]+:/.test(
                  nextLine.trim()
                )
              ) {
                break;
              }

              const match =
                nextLine.match(
                  /^(\s*continuous_deploy_tag:\s*)([^\s#]+)(.*)$/
                );

              if (!match) {
                continue;
              }

              oldRelease = match[2];

              if (
                oldRelease.toLowerCase() ===
                requestedRelease.toLowerCase()
              ) {
                console.error(
                  `Release '${requestedRelease}' is already configured.`
                );

                process.exit(1);
              }

              /*
               * Replace ONLY the tag value.
               */
              lines[j] =
                `${match[1]}${requestedRelease}${match[3]}`;

              tagFound = true;

              break;
            }

            break;
          }

          if (!targetFound) {
            console.error(
              `ERROR: Target '${actualTarget}' was not found.`
            );

            process.exit(1);
          }

          if (!tagFound) {
            console.error(
              `ERROR: continuous_deploy_tag was not found under '${actualTarget}'.`
            );

            process.exit(1);
          }

          let newContent =
            lines.join(lineEnding);

          if (endedWithNewline) {
            newContent += lineEnding;
          }

          fs.writeFileSync(
            file,
            newContent,
            "utf8"
          );

          console.log("");
          console.log("Configuration updated.");
          console.log(
            `${actualTarget}: ${oldRelease} -> ${requestedRelease}`
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `old_release=${oldRelease}\n`
          );
          NODE

      # ============================================================
      # 10. VERIFY EXACTLY ONE LINE CHANGED
      # ============================================================

      - name: Verify configuration change
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.config.outputs.config_file }}
        run: |
          echo ""
          echo "================================"
          echo "GIT DIFF"
          echo "================================"

          git diff -- "$CONFIG_FILE"

          echo ""
          echo "================================"

          if git diff --quiet; then
            echo "::error::No configuration change was produced."
            exit 1
          fi

          CHANGED_FILES="$(git diff --name-only)"

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if [ "$CHANGED_FILES" != "$CONFIG_FILE" ]; then
            echo "::error::Unexpected files were modified."

            echo ""
            echo "Expected:"
            echo "$CONFIG_FILE"

            echo ""
            echo "Actual:"
            echo "$CHANGED_FILES"

            exit 1
          fi

          ADDED_LINES="$(
            git diff \
              --numstat \
              -- "$CONFIG_FILE" |
              awk '{print $1}'
          )"

          REMOVED_LINES="$(
            git diff \
              --numstat \
              -- "$CONFIG_FILE" |
              awk '{print $2}'
          )"

          echo ""
          echo "Added lines:   $ADDED_LINES"
          echo "Removed lines: $REMOVED_LINES"

          if [ "$ADDED_LINES" -ne 1 ]; then
            echo "::error::Expected exactly 1 added line."
            echo "Refusing to create PR."
            exit 1
          fi

          if [ "$REMOVED_LINES" -ne 1 ]; then
            echo "::error::Expected exactly 1 removed line."
            echo "Refusing to create PR."
            exit 1
          fi

          /*
          This check intentionally stays in bash below.
          */

          echo ""
          echo "Diff validation successful."

      # ============================================================
      # 11. CREATE BRANCH
      #
      # Preserve ticket casing supplied by user.
      #
      # Example:
      #
      # CC-22752 remains CC-22752.
      # ============================================================

      - name: Create deployment branch
        shell: bash
        env:
          BRANCH: ${{ steps.inputs.outputs.ticket }}
        run: |
          echo "Creating branch:"
          echo "$BRANCH"

          git checkout -b "$BRANCH"

      # ============================================================
      # 12. COMMIT
      # ============================================================

      - name: Commit configuration change
        shell: bash
        env:
          CONFIG_FILE: ${{ steps.config.outputs.config_file }}
          TICKET: ${{ steps.inputs.outputs.ticket }}
          CLIENT: ${{ steps.config.outputs.actual_client }}
          TARGET: ${{ steps.target.outputs.actual_target }}
          RELEASE: ${{ steps.inputs.outputs.release }}
        run: |
          git config \
            user.name \
            "deployment-pr-bot"

          git config \
            user.email \
            "deployment-pr-bot@users.noreply.github.com"

          git add "$CONFIG_FILE"

          git commit \
            -m "$TICKET: Deploy $RELEASE to $TARGET for $CLIENT"

      # ============================================================
      # 13. PUSH
      # ============================================================

      - name: Push deployment branch
        shell: bash
        env:
          BRANCH: ${{ steps.inputs.outputs.ticket }}
        run: |
          echo "Pushing branch:"
          echo "$BRANCH"

          git push \
            origin \
            "$BRANCH"

      # ============================================================
      # 14. CREATE PR
      # ============================================================

      - name: Create Pull Request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}

          TICKET: ${{ steps.inputs.outputs.ticket }}

          CLIENT: ${{ steps.config.outputs.actual_client }}

          TARGET: ${{ steps.target.outputs.actual_target }}

          RELEASE: ${{ steps.inputs.outputs.release }}

          CONFIG_FILE: ${{ steps.config.outputs.config_file }}

          OLD_RELEASE: ${{ steps.update.outputs.old_release }}
        run: |
          PR_TITLE="$TICKET - Deploy $RELEASE to $TARGET for $CLIENT"

          PR_URL=$(gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$TICKET" \
            --title "$PR_TITLE" \
            --body "$(cat <<EOF
          ## Deployment Request

          **Deployment Ticket:** $TICKET

          **Client:** $CLIENT

          **Deployment Target:** $TARGET

          **Release:** $RELEASE

          ## Configuration File

          \`$CONFIG_FILE\`

          ## Configuration Change

          **Target**

          \`$TARGET\`

          **Field**

          \`continuous_deploy_tag\`

          **Previous release**

          \`$OLD_RELEASE\`

          **New release**

          \`$RELEASE\`

          ## Branch

          \`$TICKET\`

          ---

          Created automatically by Deployment PR Bot.
          EOF
          )")

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 15. FINAL SUMMARY
      # ============================================================

      - name: Deployment PR summary
        shell: bash
        run: |
          echo ""
          echo "================================"
          echo "DEPLOYMENT PR CREATED"
          echo "================================"

          echo ""
          echo "Ticket:"
          echo "${{ steps.inputs.outputs.ticket }}"

          echo ""
          echo "Client:"
          echo "${{ steps.config.outputs.actual_client }}"

          echo ""
          echo "Target:"
          echo "${{ steps.target.outputs.actual_target }}"

          echo ""
          echo "Configuration:"
          echo "${{ steps.config.outputs.config_file }}"

          echo ""
          echo "Previous release:"
          echo "${{ steps.update.outputs.old_release }}"

          echo ""
          echo "New release:"
          echo "${{ steps.inputs.outputs.release }}"

          echo ""
          echo "Branch:"
          echo "${{ steps.inputs.outputs.ticket }}"

          echo ""
          echo "Pull Request:"
          echo "${{ steps.pr.outputs.pr_url }}"

          echo ""
          echo "================================"
