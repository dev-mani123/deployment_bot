name: Deployment PR Bot

on:
  workflow_dispatch:
    inputs:
      ticket:
        description: "Deployment ticket"
        required: true
        type: string

      client:
        description: "Client name"
        required: true
        type: string

      target:
        description: "Exact deployment target"
        required: true
        type: choice
        options:
          - uat-preview
          - uat-stable
          - production-a
          - production-b

      release:
        description: "Release version"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  create-deployment-pr:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. DISPLAY REQUEST
      # ============================================================

      - name: Display deployment request
        shell: bash
        run: |
          echo "================================"
          echo "Deployment PR Bot"
          echo "================================"
          echo "Ticket:  ${{ inputs.ticket }}"
          echo "Client:  ${{ inputs.client }}"
          echo "Target:  ${{ inputs.target }}"
          echo "Release: ${{ inputs.release }}"
          echo "================================"

      # ============================================================
      # 3. VALIDATE INPUTS
      # ============================================================

      - name: Validate inputs
        shell: bash
        run: |
          TICKET="${{ inputs.ticket }}"
          CLIENT="${{ inputs.client }}"
          RELEASE="${{ inputs.release }}"

          if [[ ! "$TICKET" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Invalid ticket: $TICKET"
            exit 1
          fi

          if [[ ! "$CLIENT" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "::error::Invalid client: $CLIENT"
            exit 1
          fi

          if [[ ! "$RELEASE" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release version: $RELEASE"
            echo "Expected format: 26.2.3"
            exit 1
          fi

          echo "Input validation successful."

      # ============================================================
      # 4. RESOLVE CLIENT CONFIG
      # ============================================================

      - name: Resolve client configuration
        id: config
        shell: bash
        run: |
          CLIENT="${{ inputs.client }}"

          CONFIG_FILE="platform-client/clients/${CLIENT}/config.yml"

          echo "Looking for configuration:"
          echo "$CONFIG_FILE"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "::error::Client configuration not found: $CONFIG_FILE"

            echo ""
            echo "Available client configuration files:"

            find platform-client/clients \
              -maxdepth 3 \
              -type f \
              -name "config.yml" \
              2>/dev/null | sort || true

            exit 1
          fi

          echo ""
          echo "Configuration found:"
          echo "$CONFIG_FILE"

          echo "config_file=$CONFIG_FILE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 5. READ EXACT TARGET
      # ============================================================

      - name: Read deployment target
        id: target
        shell: bash
        run: |
          CONFIG_FILE="${{ steps.config.outputs.config_file }}"
          TARGET="${{ inputs.target }}"

          echo "Reading configuration:"
          echo "$CONFIG_FILE"

          echo ""
          echo "Looking for exact target:"
          echo "$TARGET"

          node - "$CONFIG_FILE" "$TARGET" <<'NODE'
          const fs = require("fs");

          const file = process.argv[2];
          const target = process.argv[3];

          const content = fs.readFileSync(file, "utf8");
          const lines = content.split(/\r?\n/);

          let targetFound = false;
          let currentRelease = null;

          const escapedTarget = target.replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
          );

          /*
           * Supports:
           *
           * uat-preview:
           * uat-preview: &uat
           * uat-stable:
           * production-a: &production
           * production-b:
           *
           * Exact target names only.
           */
          const targetPattern = new RegExp(
            `^${escapedTarget}:\\s*(?:&[A-Za-z0-9_-]+)?\\s*$`
          );

          for (let i = 0; i < lines.length; i++) {
            const line = lines[i];

            if (!targetPattern.test(line.trim())) {
              continue;
            }

            targetFound = true;

            console.log("");
            console.log(`Found target: ${line.trim()}`);

            const targetIndent =
              line.length - line.trimStart().length;

            for (let j = i + 1; j < lines.length; j++) {
              const nextLine = lines[j];

              if (!nextLine.trim()) {
                continue;
              }

              const nextIndent =
                nextLine.length - nextLine.trimStart().length;

              /*
               * Stop when another YAML section begins
               * at the same or lower indentation.
               */
              if (
                nextIndent <= targetIndent &&
                /^[A-Za-z0-9_-]+:/.test(nextLine.trim())
              ) {
                break;
              }

              const tagMatch = nextLine.match(
                /^\s*continuous_deploy_tag:\s*([^\s#]+)/
              );

              if (tagMatch) {
                currentRelease = tagMatch[1];
                break;
              }
            }

            break;
          }

          if (!targetFound) {
            console.error(
              `ERROR: Deployment target '${target}' was not found in ${file}`
            );

            console.error("");
            console.error("Possible YAML sections:");

            for (const line of lines) {
              const trimmed = line.trim();

              if (
                /^[A-Za-z0-9_-]+:\s*(?:&[A-Za-z0-9_-]+)?\s*$/.test(
                  trimmed
                )
              ) {
                console.error(` - ${trimmed}`);
              }
            }

            process.exit(1);
          }

          if (!currentRelease) {
            console.error(
              `ERROR: continuous_deploy_tag was not found under '${target}'.`
            );

            process.exit(1);
          }

          console.log("");
          console.log("================================");
          console.log("Configuration validated");
          console.log("================================");
          console.log(`File:            ${file}`);
          console.log(`Target:          ${target}`);
          console.log(`Current release: ${currentRelease}`);
          console.log("================================");

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `current_release=${currentRelease}\n`
          );
          NODE

      # ============================================================
      # 6. VALIDATE REQUESTED RELEASE
      # ============================================================

      - name: Validate requested release
        shell: bash
        run: |
          CURRENT="${{ steps.target.outputs.current_release }}"
          REQUESTED="${{ inputs.release }}"

          echo "Current release:   $CURRENT"
          echo "Requested release: $REQUESTED"

          if [ "$CURRENT" = "$REQUESTED" ]; then
            echo "::error::Release $REQUESTED is already configured for ${{ inputs.client }} / ${{ inputs.target }}"
            exit 1
          fi

          echo ""
          echo "Release change required."

      # ============================================================
      # 7. CHECK DUPLICATE BRANCH
      # ============================================================

      - name: Check duplicate branch
        shell: bash
        run: |
          BRANCH="${{ inputs.ticket }}"

          echo "Checking branch:"
          echo "$BRANCH"

          if git ls-remote \
            --exit-code \
            --heads \
            origin \
            "$BRANCH" >/dev/null 2>&1
          then
            echo "::error::Branch '$BRANCH' already exists."
            exit 1
          fi

          echo "Branch does not exist."

      # ============================================================
      # 8. UPDATE ONLY continuous_deploy_tag
      #
      # IMPORTANT:
      # Preserve the original CRLF/LF line-ending format.
      # ============================================================

      - name: Update continuous deploy tag
        id: update
        shell: bash
        run: |
          CONFIG_FILE="${{ steps.config.outputs.config_file }}"
          TARGET="${{ inputs.target }}"
          RELEASE="${{ inputs.release }}"

          node - "$CONFIG_FILE" "$TARGET" "$RELEASE" <<'NODE'
          const fs = require("fs");

          const file = process.argv[2];
          const target = process.argv[3];
          const requestedRelease = process.argv[4];

          const originalContent =
            fs.readFileSync(file, "utf8");

          /*
           * Detect original line endings.
           *
           * Windows:
           * \r\n
           *
           * Linux:
           * \n
           */
          const lineEnding =
            originalContent.includes("\r\n")
              ? "\r\n"
              : "\n";

          const endedWithNewline =
            originalContent.endsWith("\n");

          const lines =
            originalContent.split(/\r?\n/);

          /*
           * split() creates a trailing empty element
           * when the file ends with a newline.
           */
          if (
            endedWithNewline &&
            lines.length > 0 &&
            lines[lines.length - 1] === ""
          ) {
            lines.pop();
          }

          const escapedTarget = target.replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
          );

          const targetPattern = new RegExp(
            `^${escapedTarget}:\\s*(?:&[A-Za-z0-9_-]+)?\\s*$`
          );

          let targetFound = false;
          let tagFound = false;
          let oldRelease = null;

          for (let i = 0; i < lines.length; i++) {
            const line = lines[i];

            if (!targetPattern.test(line.trim())) {
              continue;
            }

            targetFound = true;

            const targetIndent =
              line.length - line.trimStart().length;

            for (let j = i + 1; j < lines.length; j++) {
              const nextLine = lines[j];

              if (!nextLine.trim()) {
                continue;
              }

              const nextIndent =
                nextLine.length -
                nextLine.trimStart().length;

              if (
                nextIndent <= targetIndent &&
                /^[A-Za-z0-9_-]+:/.test(
                  nextLine.trim()
                )
              ) {
                break;
              }

              /*
               * Example:
               *
               *   continuous_deploy_tag: 26.3.1
               *
               * Group 1:
               * spaces + continuous_deploy_tag + spacing
               *
               * Group 2:
               * release
               *
               * Group 3:
               * anything after release
               */
              const match = nextLine.match(
                /^(\s*continuous_deploy_tag:\s*)([^\s#]+)(.*)$/
              );

              if (!match) {
                continue;
              }

              oldRelease = match[2];

              if (oldRelease === requestedRelease) {
                console.error(
                  `Release ${requestedRelease} is already configured for ${target}.`
                );

                process.exit(1);
              }

              /*
               * Replace ONLY release value.
               */
              lines[j] =
                `${match[1]}${requestedRelease}${match[3]}`;

              tagFound = true;

              break;
            }

            break;
          }

          if (!targetFound) {
            console.error(
              `ERROR: Target '${target}' was not found.`
            );

            process.exit(1);
          }

          if (!tagFound) {
            console.error(
              `ERROR: continuous_deploy_tag was not found under '${target}'.`
            );

            process.exit(1);
          }

          /*
           * Reconstruct using ORIGINAL line endings.
           */
          let newContent =
            lines.join(lineEnding);

          if (endedWithNewline) {
            newContent += lineEnding;
          }

          fs.writeFileSync(
            file,
            newContent,
            "utf8"
          );

          console.log("");
          console.log("================================");
          console.log("Configuration updated");
          console.log("================================");
          console.log(`Target:   ${target}`);
          console.log(`Previous: ${oldRelease}`);
          console.log(`New:      ${requestedRelease}`);
          console.log("================================");

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `old_release=${oldRelease}\n`
          );
          NODE

      # ============================================================
      # 9. VERIFY CHANGE
      #
      # Safety requirement:
      #
      # Only config.yml may change.
      #
      # Exactly:
      # 1 removed line
      # 1 added line
      # ============================================================

      - name: Verify configuration change
        shell: bash
        run: |
          CONFIG_FILE="${{ steps.config.outputs.config_file }}"

          echo ""
          echo "================================"
          echo "GIT DIFF"
          echo "================================"

          git diff -- "$CONFIG_FILE"

          echo ""
          echo "================================"

          if git diff --quiet; then
            echo "::error::No configuration change was produced."
            exit 1
          fi

          CHANGED_FILES="$(git diff --name-only)"

          echo "Changed files:"
          echo "$CHANGED_FILES"

          if [ "$CHANGED_FILES" != "$CONFIG_FILE" ]; then
            echo "::error::Unexpected files were modified."
            echo ""
            echo "Expected:"
            echo "$CONFIG_FILE"
            echo ""
            echo "Actual:"
            echo "$CHANGED_FILES"

            exit 1
          fi

          ADDED_LINES="$(
            git diff --numstat -- "$CONFIG_FILE" |
            awk '{print $1}'
          )"

          REMOVED_LINES="$(
            git diff --numstat -- "$CONFIG_FILE" |
            awk '{print $2}'
          )"

          echo ""
          echo "Added lines:"
          echo "$ADDED_LINES"

          echo ""
          echo "Removed lines:"
          echo "$REMOVED_LINES"

          if [ "$ADDED_LINES" -ne 1 ]; then
            echo "::error::Expected exactly 1 added line."
            echo "Refusing to create PR."
            exit 1
          fi

          if [ "$REMOVED_LINES" -ne 1 ]; then
            echo "::error::Expected exactly 1 removed line."
            echo "Refusing to create PR."
            exit 1
          fi

          echo ""
          echo "Diff validation successful."

      # ============================================================
      # 10. CREATE BRANCH
      # ============================================================

      - name: Create deployment branch
        shell: bash
        run: |
          BRANCH="${{ inputs.ticket }}"

          echo "Creating branch:"
          echo "$BRANCH"

          git checkout -b "$BRANCH"

      # ============================================================
      # 11. COMMIT
      # ============================================================

      - name: Commit configuration change
        shell: bash
        run: |
          CONFIG_FILE="${{ steps.config.outputs.config_file }}"

          git config \
            user.name \
            "deployment-pr-bot"

          git config \
            user.email \
            "deployment-pr-bot@users.noreply.github.com"

          git add "$CONFIG_FILE"

          git commit \
            -m "${{ inputs.ticket }}: Deploy ${{ inputs.release }} to ${{ inputs.target }} for ${{ inputs.client }}"

      # ============================================================
      # 12. PUSH
      # ============================================================

      - name: Push deployment branch
        shell: bash
        run: |
          BRANCH="${{ inputs.ticket }}"

          echo "Pushing branch:"
          echo "$BRANCH"

          git push \
            origin \
            "$BRANCH"

      # ============================================================
      # 13. CREATE PULL REQUEST
      # ============================================================

      - name: Create Pull Request
        id: pr
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "${{ inputs.ticket }}" \
            --title "${{ inputs.ticket }} - Deploy ${{ inputs.release }} to ${{ inputs.target }} for ${{ inputs.client }}" \
            --body "$(cat <<EOF
          ## Deployment Request

          **Deployment Ticket:** ${{ inputs.ticket }}

          **Client:** ${{ inputs.client }}

          **Deployment Target:** ${{ inputs.target }}

          **Release:** ${{ inputs.release }}

          ## Configuration File

          \`${{ steps.config.outputs.config_file }}\`

          ## Configuration Change

          **Target**

          \`${{ inputs.target }}\`

          **Field**

          \`continuous_deploy_tag\`

          **Previous release**

          \`${{ steps.update.outputs.old_release }}\`

          **New release**

          \`${{ inputs.release }}\`

          ## Branch

          \`${{ inputs.ticket }}\`

          ---

          Created automatically by Deployment PR Bot.
          EOF
          )")

          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 14. SUMMARY
      # ============================================================

      - name: Deployment PR summary
        shell: bash
        run: |
          echo ""
          echo "================================"
          echo "DEPLOYMENT PR CREATED"
          echo "================================"

          echo ""
          echo "Ticket:"
          echo "${{ inputs.ticket }}"

          echo ""
          echo "Client:"
          echo "${{ inputs.client }}"

          echo ""
          echo "Target:"
          echo "${{ inputs.target }}"

          echo ""
          echo "Configuration:"
          echo "${{ steps.config.outputs.config_file }}"

          echo ""
          echo "Previous release:"
          echo "${{ steps.update.outputs.old_release }}"

          echo ""
          echo "New release:"
          echo "${{ inputs.release }}"

          echo ""
          echo "Branch:"
          echo "${{ inputs.ticket }}"

          echo ""
          echo "Pull Request:"
          echo "${{ steps.pr.outputs.pr_url }}"

          echo ""
          echo "================================"
